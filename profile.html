<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Profile page</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 20px;
        }
img {
            border-radius: 50%;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2> USER PROFILE</h2>
    <img id="photo">
    <h3 id="name"></h3>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
    <p><strong>Address:</strong> <span id="address"></span></p>
    <p><strong>Age:</strong> <span id="age"></span></p>
    <p><strong>user_name:</strong> <span id="username"></span></p>
    <button onclick="loadProfile()">load Another Person</button>
    <p id="error"></p>
    <script src="profile.js"></script>
</body>

</html>
